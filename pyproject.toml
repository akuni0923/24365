[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "24365-wildfire-detection"
version = "0.1.0"
description = "Reproducible fire and smoke detection experiments for 24/365"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics==8.3.220",
    "Pillow>=9.4",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
